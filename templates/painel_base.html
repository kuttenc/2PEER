<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Painel{% endblock %}</title>
<style>
 :root{--bg:#0d1117;--card:#161b22;--linha:#21262d;--txt:#e6edf3;--dim:#8b949e;--azul:#1f6feb;--verde:#238636;--verm:#8b2b2b}
 *{box-sizing:border-box}
 body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--txt);font-size:15px}
 .wrap{max-width:820px;margin:0 auto;padding:14px}
 h1{font-size:18px;margin:0 0 4px}
 h2{font-size:15px;margin:0 0 10px}
 a{color:#58a6ff;text-decoration:none}
 nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
 nav a{padding:8px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--card);font-size:14px}
 nav a.on{border-color:var(--azul);background:#0f2a52}
 .card{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:14px;margin-bottom:14px}
 label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
 input[type=text],input[type=password],input[type=number],input[type=file],textarea,select{
   width:100%;padding:11px;border-radius:8px;border:1px solid var(--linha);background:#0b0f14;color:var(--txt);font-size:15px;font-family:inherit}
 textarea{min-height:80px}
 button{padding:12px 16px;border-radius:8px;border:1px solid var(--linha);background:#21262d;color:var(--txt);font-size:15px;cursor:pointer}
 button.prim{background:var(--azul);border-color:#388bfd;color:#fff;font-weight:600;width:100%}
 button.verde{background:var(--verde);border-color:#2ea043;color:#fff;font-weight:600}
 button.verm{background:#5a1e1e;border-color:var(--verm);color:#ffd7d7}
 button.segundo{border-color:var(--azul);color:#58a6ff;background:#101a2b}
 input[readonly]{background:#10151b;color:var(--dim);border-style:dashed}
 .ok{padding:11px;border-radius:8px;background:#12261b;border:1px solid var(--verde);margin-bottom:12px;font-size:14px}
 .erro{padding:11px;border-radius:8px;background:#5a1e1e;border:1px solid var(--verm);margin-bottom:12px;font-size:14px}
 .muted{color:var(--dim);font-size:13px}
 .pill{padding:3px 10px;border-radius:20px;font-size:12px;background:#3a1d1d;color:#ffa198}
 .pill.on{background:#1b3320;color:#7ee787}
 .verm{color:#ffa198}
 table{width:100%;border-collapse:collapse;font-size:14px}
 th,td{padding:8px 6px;border-bottom:1px solid var(--linha);text-align:left;vertical-align:top}
 th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
 .linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
 .tel{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
 input.maq{width:158px;padding:9px;border-radius:8px;border:1px solid var(--linha);background:#0b0f14;
   color:var(--txt);font-size:14px;font-family:inherit}
 input.maq:focus{border-color:var(--azul);outline:none}
 button.mini{padding:8px 10px;font-size:13px}
 button.alerta{border-color:var(--verm);background:#3a1d1d;color:#ffd7d7}
 button:disabled{opacity:.45;cursor:not-allowed}
 th.chk,td.chk{display:none;width:34px;text-align:center}
 body.mesclar th.chk,body.mesclar td.chk{display:table-cell}
 body.mesclar td.chk input{width:20px;height:20px;accent-color:var(--azul)}
 th.lote,td.lote{display:none;width:44px;text-align:center}
 body.lote th.lote,body.lote td.lote{display:table-cell}
 body.lote td.lote input{width:20px;height:20px;accent-color:#ff8c7a}
 .numeros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
 .numeros div{background:#0b0f14;border:1px solid var(--linha);border-radius:8px;padding:8px}
 .numeros b{display:block;font-size:20px}
 .nomes{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
 .nomes span{background:#0b0f14;border:1px solid var(--linha);border-radius:6px;padding:2px 6px;font-size:12px}
 .prog{height:8px;background:#0b0f14;border:1px solid var(--linha);border-radius:6px;overflow:hidden;margin:8px 0}
 .prog i{display:block;height:100%;width:0;background:var(--verde);transition:width .4s}
 .lista{max-height:230px;overflow:auto;border:1px solid var(--linha);border-radius:8px;
   background:#0b0f14;margin:6px 0 10px}
 .lista .item{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:7px 9px;
   border-bottom:1px solid var(--linha);font-size:13px}
 .lista .item input{width:18px;height:18px;accent-color:var(--verde);align-self:center}
 .lista .item.fora{opacity:.45}
 .lista .muted{flex-basis:100%;padding-left:26px;margin-top:-4px}
 .barra{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
   background:#0f2a52;border:1px solid var(--azul);border-radius:10px;padding:10px;margin-top:10px}
 .barra[hidden]{display:none}
 .modal{position:fixed;inset:0;background:rgba(3,7,12,.82);display:flex;align-items:center;
   justify-content:center;padding:14px;z-index:50}
 .modal[hidden]{display:none}
 .modal-caixa{background:var(--card);border:1px solid var(--azul);border-radius:12px;
   padding:16px;max-width:520px;width:100%}
 .modal-caixa .col{flex:1;min-width:190px;background:#0b0f14;border:1px solid var(--linha);
   border-radius:8px;padding:10px}
 .rotulo{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
 .cb{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--txt);margin:10px 0}
 .cb input{width:auto}
 code{background:#0b0f14;padding:2px 5px;border-radius:4px;font-size:12px;word-break:break-all}
 img.prev{width:150px;height:150px;border-radius:8px;border:1px solid var(--linha)}
 @media (max-width:560px){th,td{font-size:13px;padding:6px 4px}}
</style>
</head>
<body>
<div class="wrap">
  {% if request.endpoint not in ('painel.entrar', None) %}
  <nav>
    <a href="{{ url_for('painel.index') }}" class="{{ 'on' if request.endpoint == 'painel.index' }}">Início</a>
    <a href="{{ url_for('painel.config') }}" class="{{ 'on' if request.endpoint == 'painel.config' }}">Configuração</a>
    <a href="{{ url_for('painel.avisos') }}" class="{{ 'on' if request.endpoint in ('painel.avisos', 'painel.avisos_enviar') }}">Avisos</a>
    <a href="{{ url_for('painel.acessos') }}" class="{{ 'on' if request.endpoint in ('painel.acessos', 'painel.apagar', 'painel.recuperar') }}">Acessos</a>
    <a href="{{ url_for('painel.recuperacao') }}" class="{{ 'on' if request.endpoint in ('painel.recuperacao', 'painel.recuperacao_foto') }}">Recuperação</a>
    <a href="{{ url_for('painel.clientes') }}" class="{{ 'on' if request.endpoint == 'painel.clientes' }}">Clientes</a>
    <a href="{{ url_for('painel.deletar') }}" class="{{ 'on' if request.endpoint in ('painel.deletar', 'painel.deletar_contagem', 'painel.deletar_executar') }}">Deletar</a>
    <a href="{{ url_for('painel.links') }}" class="{{ 'on' if request.endpoint in ('painel.links', 'painel.links_encurtar') }}">Links</a>
    <a href="{{ url_for('painel.senha') }}">Senha</a>
    <a href="{{ url_for('painel.sair') }}">Sair</a>
  </nav>
  {% endif %}
  {% block corpo %}{% endblock %}
  <p class="muted" style="margin-top:20px">Painel online &middot; rodando no Render &middot; {{ agora }} UTC</p>
</div>
{% block scripts %}{% endblock %}
<script>
function mascaraTelefone(campo) {
  var d = campo.value.replace(/\D/g, '');
  if (d.length > 11 && d.substring(0, 2) === '55') d = d.substring(2);
  d = d.substring(0, 11);
  var v;
  if (d.length === 0) v = '';
  else if (d.length <= 2) v = '(' + d;
  else if (d.length <= 6) v = '(' + d.substring(0, 2) + ') ' + d.substring(2);
  else if (d.length <= 10) v = '(' + d.substring(0, 2) + ') ' + d.substring(2, 6) + '-' + d.substring(6);
  else v = '(' + d.substring(0, 2) + ') ' + d.substring(2, 7) + '-' + d.substring(7);
  if (v !== campo.value) campo.value = v;
}
document.addEventListener('input', function (evento) {
  var alvo = evento.target;
  if (alvo && alvo.classList && alvo.classList.contains('maq')) mascaraTelefone(alvo);
});
</script>
</body>
</html>
