<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<link rel="canonical" href="painel/">
<title>C&oacute;pia de testes do painel do O Peixeiro</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1220;
         color:#e8eefc; font:16px/1.6 system-ui,Segoe UI,Roboto,sans-serif; text-align:center }
  a { color:#5cc8ff; font-weight:600 }
</style>
</head>
<body>
<div>
  <p>Abrindo o painel...</p>
  <p><a href="painel/">Abrir o painel</a></p>
</div>
<script>
// Links antigos trazem só o base64 do cliente (?d=); a página r/ é quem sabe para onde ele vai
// hoje, então ela também recebe os que já foram enviados antes desta página existir.
(function () {
  var d = new URLSearchParams(location.search).get("d");
  location.replace(d ? "r/?d=" + encodeURIComponent(d) : "painel/" + location.search + location.hash);
})();
</script>
</body>
</html>
